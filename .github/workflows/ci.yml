name: ci

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  mock-consumer-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run consumer mock contract tests
        run: bash scripts/run-mock-consumer-contract-tests.sh

  publish-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trading-cli
        uses: actions/checkout@v4

      - name: Checkout trade-nexus authoritative spec source
        uses: actions/checkout@v4
        with:
          repository: iamtxena/trade-nexus
          ref: main
          path: trade-nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate publish readiness
        run: bash scripts/prepare-publish-release.sh --spec "${GITHUB_WORKSPACE}/trade-nexus/docs/architecture/specs/platform-api.openapi.yaml"

  sdk-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trading-cli
        uses: actions/checkout@v4

      - name: Checkout trade-nexus authoritative spec source
        uses: actions/checkout@v4
        with:
          repository: iamtxena/trade-nexus
          ref: main
          path: trade-nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify SDK drift against authoritative contract
        run: bash scripts/verify-sdk-drift.sh --spec "${GITHUB_WORKSPACE}/trade-nexus/docs/architecture/specs/platform-api.openapi.yaml"
