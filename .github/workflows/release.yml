name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Set to true to publish to npm. Default is dry-run."
        required: false
        default: "false"
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout trade-nexus authoritative spec source
        uses: actions/checkout@v4
        with:
          repository: iamtxena/trade-nexus
          ref: main
          path: trade-nexus

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate semver/changelog/tag, SDK drift, and package dry-run
        run: bash scripts/prepare-publish-release.sh --spec "${GITHUB_WORKSPACE}/trade-nexus/docs/architecture/specs/platform-api.openapi.yaml"

      - name: Publish package to npm
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_UPDATE_NOTIFIER: "false"
        run: npm publish --access public

      - name: Dry-run complete
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish != 'true' }}
        run: echo "Dry-run complete. Set workflow input publish=true to publish to npm."
